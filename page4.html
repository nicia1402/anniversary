<!DOCTYPE html>
<html>
<head>
  <title>Forever in my heart, my love, all of it is yours. ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Forever & Always, we will stay committed. 💍</h1>
 <p>
  No distance.<br>
  No time.<br>
  No circumstance.<br><br>

  Will ever change how much I love you.
</p>

<img src="memory.jpg" class="love-image">

<p>
  Happy 1 Year, My Love..<br>
  Happy Valentine’s.<br>
  I’m yours, forever. ❤️
</p>
<div class="hold-container">
  <button id="holdButton">Press & Hold ❤️</button>
  <div id="secretMessage" class="hidden-message">
    I don’t just love you for today.
    <br><br>
    I choose you. Every day. ❤️
  </div>
</div>

</div>

<script>
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}
setInterval(createHeart, 300);
</script>

</body>
</html>
